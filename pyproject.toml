[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zyte-spidermon"
dynamic = ["version"]
description = "Zyte spidermon is a collection of useful tools for data validation, stats monitoring, and notification messages that can be used within Zyte"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [{ name = "Zyte", email = "opensource@zyte.com" }]
dependencies = [
    "scrapy>=2.6.0",
    "spidermon>=1.18.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Scrapy",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/scrapy-plugins/zyte-spidermon"
Source = "https://github.com/scrapy-plugins/zyte-spidermon"
Tracker = "https://github.com/scrapy-plugins/zyte-spidermon/issues"

[tool.hatch.version]
path = "zyte_spidermon/VERSION"
pattern = "^(?P<version>.+)$"

[tool.bumpversion]
current_version = "0.0.1"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[[tool.bumpversion.files]]
filename = "zyte_spidermon/VERSION"

[tool.ruff.lint]
# I - isort, B - flake8-bugbear, C4 - flake8-comprehensions, SIM - flake8-simplify
extend-select = ["I", "B", "C4", "SIM"]
ignore = ["SIM115", "SIM105"]

[tool.ruff.format]
docstring-code-format = true
